<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily Work Report</title>
  </head>
  <!--
    bg-fixed + bg-no-repeat zaroori hain: gradient by default tile hota hai,
    aur body sirf ek screen jitni unchi hoti hai, to lambe page par wahi
    naarangi dhabbe beech me dobara chhapne lagte the.
  -->
  <body
    class="min-h-full m-0 font-sans text-ink antialiased bg-bg bg-fixed bg-no-repeat
           bg-[radial-gradient(900px_500px_at_10%_-10%,#fde7cf,transparent_60%),radial-gradient(700px_420px_at_100%_0%,#f7ddc6,transparent_55%)]"
  >
    <div id="root" class="min-h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
