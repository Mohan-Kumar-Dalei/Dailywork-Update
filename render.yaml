# Ek hi service: Express API + React ka build, dono ek URL par.
# Isse CORS aur cross-site cookie ka jhamela hi nahi rehta.
services:
  - type: web
    name: dailywork-backend
    runtime: node
    plan: free
    # rootDir nahi -- build ko dono folder chahiye
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      # Free plan par disk nahi milti, isliye data service ke apne folder me.
      # Dhyan rahe: har deploy/restart par ye mit jaata hai aur sabko dobara
      # sign in karna padta hai.
      #
      # Starter par upgrade karo to neeche wala disk khol dena aur
      # DATA_DIR ko /var/data kar dena:
      #
      # disk:
      #   name: dailywork-data
      #   mountPath: /var/data
      #   sizeGB: 1

      # https par cookie ke liye
      - key: COOKIE_SECURE
        value: "true"

      # ye Render khud nahi bhar sakta
      - key: OAUTH_CLIENT_ID
        sync: false
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_REDIRECT
        sync: false      # https://<service>.onrender.com/api/auth/callback
      - key: CLIENT_ORIGIN
        sync: false      # https://<service>.onrender.com  (login ke baad wapas yahin)
      - key: SHEET_ID
        sync: false
      - key: LOG_SHEET_ID
        sync: false
